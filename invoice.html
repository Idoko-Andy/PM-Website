<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Invoice — Legacy Ohio Homes</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--ink:#1c1c1c;--mute:#6b6b6b;--line:#e4e4e2;--ok:#1f7a45;--bad:#b42318;--btn:#111}
@media (prefers-color-scheme: dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f2f2f2;--mute:#a3a3a3;--line:#333;--ok:#5fcf80;--bad:#ef6f6f;--btn:#fff}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.brand{font-size:13px;color:var(--mute);margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
h1{font-size:20px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:none}.row span:first-child{color:var(--mute)}
.total{font-size:22px;font-weight:700}
a.view{display:inline-block;margin-top:10px;color:inherit;font-weight:600}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
input[type=text]{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.padwrap{position:relative;border:1px dashed var(--mute);border-radius:8px;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:170px}
.clear{position:absolute;right:8px;top:8px;font-size:13px;background:#eee;color:#111;border:0;border-radius:6px;padding:4px 8px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;color:var(--ink)}
.chk input{width:22px;height:22px;margin-top:1px;flex:none}
button.go{width:100%;margin-top:16px;font-size:17px;font-weight:600;padding:14px;border-radius:10px;border:0;background:var(--btn);color:var(--bg)}
button.go:disabled{opacity:.4}
.msg{font-size:15px;margin-top:10px}.msg.err{color:var(--bad)}
.done{color:var(--ok);font-weight:600;font-size:18px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Legacy Ohio Homes · invoice prepared for you</div>
  <div id="app"><div class="card">Loading…</div></div>
</div>
<script>
const FN = "https://kwhgymympuhfvqbedwpd.supabase.co/functions/v1/rtr-dispatch";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3aGd5bXltcHVoZnZxYmVkd3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjI5MDAsImV4cCI6MjA5MjYzODkwMH0.5LL4H-kaX0F6jzM_1BBXpvxe-Zc-mN_zFH6tZExXrUI";
const token = new URLSearchParams(location.search).get("t") || "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
const call = async body => (await fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + KEY }, body: JSON.stringify(body) })).json();
const app = document.getElementById("app");

function summary(inv){
  return `<div class="card"><h1>Invoice ${esc(inv.invoice_no)}</h1>
    <div class="row"><span>From</span><span>${esc(inv.contractor_name)}</span></div>
    <div class="row"><span>Bill to</span><span>${esc(inv.bill_to)}</span></div>
    <div class="row"><span>Job address</span><span>${esc(inv.address)}</span></div>
    <div class="row"><span>Work</span><span style="text-align:right">${esc(inv.description)}</span></div>
    <div class="row"><span>Total (labor &amp; materials)</span><span class="total">${money(inv.amount)}</span></div>
    <a class="view" href="${esc(inv.signed_pdf_url || inv.pdf_url)}" target="_blank" rel="noopener">View the full invoice (PDF) →</a></div>`;
}

async function start(){
  if(!token){ app.innerHTML = `<div class="card">This link is missing its code. Text Gabe at (740) 639-2741.</div>`; return; }
  const inv = await call({ action: "invoice_get", token }).catch(()=>({ error: "Couldn't load. Check your connection and try again." }));
  if(inv.error){ app.innerHTML = `<div class="card msg err">${esc(inv.error)}</div>`; return; }
  if(inv.status === "signed"){ app.innerHTML = summary(inv) + `<div class="card"><div class="done">✓ Signed${inv.signer_name?" by "+esc(inv.signer_name):""}</div><div class="note">You're all set. Thanks!</div></div>`; return; }
  app.innerHTML = summary(inv) + `<div class="card">
    <label for="nm">Your name</label><input id="nm" type="text" autocomplete="name" placeholder="First and last name">
    <label>Sign with your finger</label>
    <div class="padwrap"><canvas id="pad"></canvas><button class="clear" type="button" id="clr">Clear</button></div>
    <label class="chk"><input type="checkbox" id="ok"> <span>I confirm this invoice is correct for the work described.</span></label>
    <button class="go" id="go" disabled>Sign invoice</button>
    <div class="msg" id="msg"></div>
    <div class="note">Prefer to send your own invoice? That's fine. Just text it to Gabe.</div></div>`;
  setupPad(inv);
}

function setupPad(inv){
  const c = document.getElementById("pad"), ctx = c.getContext("2d");
  let drawn = false, down = false, last = null;
  const fit = () => { const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1; c.width = r.width * d; c.height = r.height * d; ctx.setTransform(d,0,0,d,0,0); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111"; drawn = false; check(); };
  const pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  c.addEventListener("pointerdown", e => { down = true; last = pos(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", e => { if(!down) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; if(!drawn){ drawn = true; check(); } });
  ["pointerup","pointercancel","pointerleave"].forEach(t => c.addEventListener(t, () => { down = false; }));
  document.getElementById("clr").onclick = fit;
  const nm = document.getElementById("nm"), ok = document.getElementById("ok"), go = document.getElementById("go"), msg = document.getElementById("msg");
  function check(){ go.disabled = !(drawn && nm.value.trim().length >= 2 && ok.checked); }
  nm.oninput = check; ok.onchange = check;
  go.onclick = async () => {
    go.disabled = true; msg.className = "msg"; msg.textContent = "Signing…";
    const r = await call({ action: "invoice_sign", token, name: nm.value.trim(), signature: c.toDataURL("image/png") }).catch(()=>({ error: "Couldn't send. Check your connection and try again." }));
    if(r.error){ msg.className = "msg err"; msg.textContent = r.error; go.disabled = false; return; }
    inv.status = "signed"; inv.signer_name = nm.value.trim(); inv.signed_pdf_url = r.signed_pdf_url;
    app.innerHTML = summary(inv) + `<div class="card"><div class="done">✓ Signed. Thank you!</div><div class="note">A copy is saved with the job. You can close this page.</div></div>`;
  };
  fit(); window.addEventListener("resize", () => { if(!drawn) fit(); });
}
start();
</script>
</body>
</html>
