<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Remedies — Legacy Homes PM</title>
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
:root{
  --bg:#1a1a1a;--bar:#111;--line:#2a2a2a;--line2:#333;--panel:#1e1e1e;--panel2:#232323;
  --fg:#fff;--mute:#b4bcc8;--dim:#6b7280;
  --ok:#5fcf80;--warn:#f0b35a;--bad:#ef6f6f;--info:#7cb7ff;
}
body{background:var(--bg);color:var(--fg);min-height:100vh}
a{color:inherit}
button{font:inherit;cursor:pointer}

.util-bar{background:var(--bar);border-bottom:1px solid var(--line);padding:6px 20px;display:flex;align-items:center;justify-content:space-between;min-height:36px}
.site-title{font-size:13px;font-weight:500}
.util-right{display:flex;gap:6px;align-items:center}
.ubtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;border-radius:6px;border:1px solid #444;background:transparent;color:#fff;white-space:nowrap}
.ubtn:hover{background:var(--line)}
.ubtn.primary{background:#fff;color:#111;border-color:#fff;font-weight:500}
.ubtn.primary:hover{background:#e8e8e8}
.ubtn:disabled{opacity:.45;cursor:default}
.ubtn.small{padding:3px 8px;font-size:11.5px;border-radius:5px}

.brand-bar{background:var(--bar);padding:10px 20px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.brand-main{font-size:18px;font-weight:500}
.brand-sub{font-size:13px;color:var(--mute);margin-top:2px}

.wrap{padding:16px 20px 60px;max-width:1400px}

/* summary strip */
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:150px;flex:1}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.stat.warn b{color:var(--warn)}
.stat.bad b{color:var(--bad)}
.stat.ok b{color:var(--ok)}

.controls{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.controls label{display:flex;gap:6px;align-items:center;cursor:pointer}
.controls .sp{flex:1}
.controls .synced{font-size:11.5px;color:var(--dim)}

/* property block */
.prop{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.prop-h{display:flex;align-items:baseline;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.prop-h .addr{font-size:15px;font-weight:600}
.prop-h .meta{font-size:12px;color:var(--mute)}
.prop-h .meta.red{color:var(--bad)}
.prop-h .sp{flex:1}
.prop-h a{font-size:12px;color:var(--info);text-decoration:none}
.prop-h .done-frac{font-size:12px;color:var(--mute)}
.prop-h .done-frac b{color:var(--fg)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--dim);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;font-size:13px;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr.done td{opacity:.55}
td.no{width:34px;color:var(--mute);white-space:nowrap}
td.desc{max-width:520px;line-height:1.35}
td.desc .trade{display:inline-block;margin-top:4px;font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
td.desc .trade.ask{border-style:dashed;color:var(--warn);cursor:pointer}

/* the truth line */
.truth{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;min-width:280px}
.truth .k{font-size:11px;color:var(--dim);white-space:nowrap;padding-top:2px}
.truth .v{font-size:12.5px}
.cc{display:inline-flex;align-items:center;gap:6px}
.box{width:14px;height:14px;border:1.5px solid var(--mute);border-radius:3px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.box.on{background:var(--ok);border-color:var(--ok);color:#111}
.cc .photos{color:var(--dim);font-size:11.5px}
.said{color:var(--fg)}
.said .when{color:var(--dim);font-size:11.5px;margin-left:6px}
.said.none{color:var(--dim);font-style:italic}
.said.stale{color:var(--warn)}

td.who{width:260px}
.who select,.who input{width:100%;background:var(--bg);border:1px solid var(--line2);color:#fff;border-radius:6px;padding:6px 8px;font-size:12.5px}
.who select:focus,.who input:focus{outline:none;border-color:#666}
.who .cctext{font-size:11.5px;color:var(--dim);margin-top:4px}
.who .cctext b{color:var(--mute);font-weight:500}
.who .unmatched{color:var(--warn)}

td.act{width:150px;white-space:nowrap;text-align:right}
td.act .ubtn{margin-left:4px}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--mute);margin-bottom:4px}
.pill.bids{border-color:#4a6b8a;color:var(--info)}
.pill.chase{border-color:#6b5a3a;color:var(--warn)}
.pill.walk{border-color:#3a6b4a;color:var(--ok)}

/* access + schedule + bids */
.access{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.access .k{color:var(--dim);font-size:11px}
.access .code{font-family:ui-monospace,Menlo,monospace;color:var(--fg);letter-spacing:.5px}
.access.missing{color:var(--warn)}
.access form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
.access input{background:var(--bg);border:1px solid var(--line2);color:#fff;border-radius:6px;padding:5px 8px;font-size:12.5px}
.access input.loc{flex:2;min-width:160px}.access input.cd{width:110px}.access input.nt{flex:3;min-width:180px}
.sched{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.sched-h{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600}
.sched-h .sp{flex:1}
.sched-row{display:flex;gap:12px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.sched-row:last-child{border-bottom:none}
.sched-row .d{width:86px;color:var(--fg);font-weight:500;white-space:nowrap}
.sched-row .w{flex:1;color:var(--mute)}
.sched-row .w b{color:var(--fg);font-weight:500}
.sched-empty{padding:10px 14px;font-size:12.5px;color:var(--dim)}
.bidlist{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.bid{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.bid b{color:var(--fg);font-weight:600}
.pill.yes{border-color:#3a6b4a;color:var(--ok)}
.empty{padding:40px;text-align:center;color:var(--mute);font-size:13px}
/* contractor picker */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:100%;max-width:560px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h b{font-size:15px}.modal-h p{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.35}
.modal-b{max-height:55vh;overflow:auto}
.pick{display:flex;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick.off{opacity:.45;cursor:default}
.pick .nm{flex:1}.pick .nm small{display:block;color:var(--dim);font-size:11.5px;margin-top:1px}
.pick .tier{font-size:11px;border:1px solid var(--line2);border-radius:10px;padding:1px 7px;color:var(--mute);white-space:nowrap}
.pick .tier.t1{border-color:#3a6b4a;color:var(--ok)}.pick .tier.t2{border-color:#4a6b8a;color:var(--info)}
.pick .rec{font-size:10.5px;color:var(--ok);margin-left:6px}
.modal-f{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .sp{flex:1}.modal-f .cnt{font-size:12px;color:var(--mute)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
.toast.show{display:block}

@media (max-width:600px){
  .strip{gap:6px}.stat{min-width:0;padding:6px 8px;flex:1 1 30%}.stat b{font-size:16px}.stat span{font-size:10.5px}
}
@media (max-width:900px){
  td.who{width:auto}.truth{min-width:0}.act{text-align:left}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{padding:10px;border-bottom:1px solid var(--line)}
  td{border:none;padding:4px 0}
  td.no{display:inline;margin-right:6px}td.desc{display:inline}
}
</style>
</head>
<body>
<div class="util-bar">
  <div class="site-title">Legacy Homes PM Dashboard</div>
  <div class="util-right">
    <a class="ubtn" href="/">Dashboard</a>
    <button class="ubtn" id="btn-sync">Pull from CompanyCam</button>
  </div>
</div>
<div class="brand-bar">
  <div>
    <div class="brand-main">Request to Remedy</div>
    <div class="brand-sub">What CompanyCam says, who's on it, and the last word from the contractor — every text goes out on (740) 639-2741.</div>
  </div>
</div>

<div class="wrap">
  <div class="strip" id="strip"></div>
  <div class="sched" id="sched"></div>
  <div class="controls">
    <label><input type="checkbox" id="show-done"> Show completed items</label>
    <span class="sp"></span>
    <span class="synced" id="synced"></span>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<div class="toast" id="toast"></div>
<div id="picker"></div>

<script>
const SUPABASE_URL = "https://kwhgymympuhfvqbedwpd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__DNUtcdM8SqCMzTZM4gtXw_1wf9IWa9";
const ANON_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3aGd5bXltcHVoZnZxYmVkd3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjI5MDAsImV4cCI6MjA5MjYzODkwMH0.5LL4H-kaX0F6jzM_1BBXpvxe-Zc-mN_zFH6tZExXrUI";
// anonymous client for the tracker (works without signing in)
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: "rtr-anon" } });
// signed-in client: shares the dashboard's Google sign-in (same site). Lockbox codes only load through this.
const authSb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let SESSION = null, ACCESS = {}, EDIT_ACCESS = null, CAL_URL = "";

let ITEMS = [], CONTRACTORS = [], TRADES = []; const SHOW_ALL = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const fmt = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"}) : "";
const ago = iso => { if(!iso) return ""; const h = (Date.now()-new Date(iso))/36e5; return h<1?"just now":h<24?Math.round(h)+"h ago":Math.round(h/24)+"d ago"; };
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600); }

async function load(){
  const [a,b] = await Promise.all([
    sb.from("v_rtr_tracker").select("*").not("cc_task_id","is",null).neq("status","cancelled").order("address").order("item_no"),
    sb.from("contractor_directory").select("id,name,trade,phone,vetting_tier,jobs_done_n,is_internal").eq("is_archived",false).eq("active",true).order("trade").order("vetting_tier").order("jobs_done_n",{ascending:false,nullsFirst:false}),
  ]);
  if(a.error){ $("#list").innerHTML=`<div class="empty">Couldn't load remedies: ${esc(a.error.message)}</div>`; return; }
  ITEMS = a.data||[]; CONTRACTORS = b.data||[];
  TRADES = [...new Set(CONTRACTORS.map(c=>c.trade))].filter(Boolean).sort();
  try { SESSION = (await authSb.auth.getSession()).data.session; } catch { SESSION = null; }
  ACCESS = {};
  const pids = [...new Set(ITEMS.map(i=>i.property_id).filter(Boolean))];
  if (SESSION && pids.length) {
    const r = await authSb.from("pm_properties").select("id,access_lockbox_location,access_code,access_notes,access_updated_at,access_updated_by").in("id", pids);
    for (const p of r.data||[]) ACCESS[p.id] = p;
    if (!CAL_URL) { const t = await authSb.from("pm_settings").select("data").eq("key","rtr_calendar_token").maybeSingle(); if (t.data?.data?.token) CAL_URL = `${SUPABASE_URL}/functions/v1/rtr-calendar?token=${t.data.data.token}`; }
  }
  const last = ITEMS.map(i=>i.cc_synced_at||"").sort().pop();
  $("#synced").textContent = last ? "CompanyCam last pulled " + ago(last) : "";
  render();
}

function stateOf(i){
  if(i.cc_done) return {key:"done", pill:""};
  if(!i.contractor_id && !i.cc_contractor_text){
    if(i.dispatched_n>0 && i.bids_n>=1) return {key:"bids", pill:`<span class="pill bids">${i.bids_n} of ${i.dispatched_n} bids in</span>`};
    if(i.dispatched_n>0) return {key:"waiting", pill:`<span class="pill bids">waiting on ${i.dispatched_n} bids</span>`};
    return {key:"unassigned", pill:""};
  }
  if(i.status==="done") return {key:"walk", pill:`<span class="pill walk">says done — walk it</span>`};
  if(i.contractor_internal) return {key:"chase", pill:`<span class="pill yes">maintenance on it</span>`};
  if(i.awarded_bid_id && !i.award_confirmed_at) return {key:"chase", pill:`<span class="pill chase">awarded — waiting on their YES</span>`};
  if(i.award_confirmed_at && i.scheduled_start) return {key:"chase", pill:`<span class="pill yes">confirmed · starts ${fmt(i.scheduled_start)}</span>`};
  return {key:"chase", pill:`<span class="pill chase">in progress</span>`};
}

function render(){
  const showDone = $("#show-done").checked, onlyActive = true;
  const byAddr = {};
  for(const i of ITEMS){ (byAddr[i.address] = byAddr[i.address]||[]).push(i); }
  let open=0, unassigned=0, chase=0, walk=0, bids=0;
  const blocks=[];
  for(const [addr, items] of Object.entries(byAddr)){
    const wt = items[0].walkthrough_date, close = items[0].closing_date_sell;
    const openItems = items.filter(i=>!i.cc_done);
    const activeProp = (wt && new Date(wt+"T12:00:00")>=today) || (close && new Date(close+"T12:00:00")>=today) || openItems.some(i=>i.contractor_id||i.dispatched_n>0);
    if(onlyActive && !activeProp && openItems.length) continue;
    if(!openItems.length && !showDone) continue;
    for(const i of openItems){ open++; const s=stateOf(i).key; if(s==="unassigned")unassigned++; else if(s==="chase")chase++; else if(s==="walk")walk++; else bids++; }
    const rows = items.filter(i=>showDone||!i.cc_done).map(row).join("");
    if(!rows) continue;
    const daysTo = wt ? Math.round((new Date(wt+"T12:00:00")-today)/864e5) : null;
    blocks.push(`<div class="prop">
      <div class="prop-h">
        <span class="addr">${esc(addr)}</span>
        ${items[0].rtr_owner?`<span class="meta">owner ${esc(items[0].rtr_owner)}</span>`:""}
        ${wt?`<span class="meta ${daysTo!==null&&daysTo<3?'red':''}">walk-through ${fmt(wt)}${daysTo!==null?` (${daysTo<0?'past':daysTo+' days'})`:''}</span>`:""}
        ${close?`<span class="meta">closes ${fmt(close)}</span>`:""}
        <span class="sp"></span>
        <span class="done-frac"><b>${items.length-openItems.length}</b> of ${items.length} done</span>
        ${reportBtn(items)}
        <a href="${esc(items[0].companycam_todo_url)}" target="_blank" rel="noopener">Open in CompanyCam</a>
      </div>
      ${accessRow(items[0])}
      <table><thead><tr><th>#</th><th>Remedy</th><th>CompanyCam · contractor · last word</th><th>Assigned to</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`);
  }
  $("#strip").innerHTML = `
    <div class="stat"><b>${open}</b><span>open remedy items</span></div>
    <div class="stat ${unassigned?'bad':''}"><b>${unassigned}</b><span>no contractor yet</span></div>
    <div class="stat"><b>${bids}</b><span>out for bids</span></div>
    <div class="stat ${chase?'warn':''}"><b>${chase}</b><span>contractor on it</span></div>
    <div class="stat ${walk?'ok':''}"><b>${walk}</b><span>need a walk-through</span></div>`;
  $("#list").innerHTML = blocks.join("") || `<div class="empty">Nothing open. Pull from CompanyCam to refresh.</div>`;
  renderSchedule();
}

function renderSchedule(){
  const y = new Date(today); y.setDate(y.getDate()-1);
  const rows = ITEMS.filter(i=>i.scheduled_start && !i.cc_done && new Date(i.scheduled_start+"T12:00:00")>=y)
    .sort((a,b)=>a.scheduled_start.localeCompare(b.scheduled_start));
  const day = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"});
  const cal = CAL_URL ? `<button class="ubtn small" onclick="copyCal()">Copy calendar link for Google Calendar</button>` : (SESSION ? "" : `<span class="k" style="font-size:11.5px;color:var(--dim);font-weight:400">Sign in on the Dashboard to get the Google Calendar link</span>`);
  $("#sched").innerHTML = `<div class="sched-h">Schedule — contractor start dates<span class="sp"></span>${cal}</div>` + (rows.length
    ? rows.map(i=>`<div class="sched-row"><span class="d">${day(i.scheduled_start)}</span><span class="w"><b>${esc(i.contractor_name||"Contractor")}</b> · ${esc(i.address)} #${i.item_no??""} ${esc((i.description||"").slice(0,70))}</span>${i.award_confirmed_at?'<span class="pill yes">confirmed</span>':'<span class="pill chase">waiting on YES</span>'}</div>`).join("")
    : `<div class="sched-empty">No start dates yet. They show up here (and on Gabe's Google Calendar) once a job is awarded with a start date.</div>`);
}
async function copyCal(){
  try { await navigator.clipboard.writeText(CAL_URL); toast("Copied. In Google Calendar: Other calendars → + → From URL → paste"); }
  catch { prompt("Copy this link, then in Google Calendar: Other calendars → + → From URL", CAL_URL); }
}

function accessRow(it){
  const pid = it.property_id; if(!pid) return "";
  const a = ACCESS[pid];
  if (EDIT_ACCESS === pid) {
    return `<div class="access"><form onsubmit="saveAccess(event,'${pid}')">
      <span class="k">Lockbox</span>
      <input class="loc" name="loc" placeholder="Where is it? e.g. front door handle" value="${esc(a?.access_lockbox_location)}">
      <input class="cd" name="code" placeholder="Code" value="${esc(a?.access_code)}" autocomplete="off">
      <input class="nt" name="notes" placeholder="Notes: alarm, pets, which door…" value="${esc(a?.access_notes)}">
      <button class="ubtn small primary" type="submit">Save</button>
      <button class="ubtn small" type="button" onclick="EDIT_ACCESS=null;render()">Cancel</button>
    </form></div>`;
  }
  if (!SESSION) {
    return `<div class="access ${it.access_on_file?'':'missing'}"><span class="k">Access</span>${it.access_on_file?'Lockbox code on file':'No lockbox code on file — contractors will be told to text for access'}<span style="color:var(--dim)">· sign in on the <a href="/" style="color:var(--info)">Dashboard</a> to view or edit</span></div>`;
  }
  if (!a?.access_code) {
    return `<div class="access missing"><span class="k">Access</span>No lockbox code on file — contractors will be told to text for access <button class="ubtn small" onclick="EDIT_ACCESS='${pid}';render()">Add lockbox</button></div>`;
  }
  return `<div class="access"><span class="k">Access</span>Lockbox ${esc(a.access_lockbox_location||"")} · code <span class="code">${esc(a.access_code)}</span>${a.access_notes?` · ${esc(a.access_notes)}`:""}
    <span style="color:var(--dim);font-size:11.5px">${a.access_updated_at?`updated ${ago(a.access_updated_at)}${a.access_updated_by?" by "+esc(a.access_updated_by.split("@")[0]):""}`:""}</span>
    <button class="ubtn small" onclick="EDIT_ACCESS='${pid}';render()">Edit</button></div>`;
}
async function saveAccess(e, pid){
  e.preventDefault();
  const f = e.target;
  const row = { access_lockbox_location: f.loc.value.trim()||null, access_code: f.code.value.trim()||null, access_notes: f.notes.value.trim()||null,
    access_updated_at: new Date().toISOString(), access_updated_by: SESSION?.user?.email || null };
  const { error } = await authSb.from("pm_properties").update(row).eq("id", pid);
  if (error) return toast("Couldn't save: " + error.message);
  EDIT_ACCESS = null; toast("Lockbox saved"); await load();
}

function row(i){
  const st = stateOf(i);
  const stale = i.last_contact_at && (Date.now()-new Date(i.last_contact_at))/36e5 > 48;
  const said = i.cc_done
    ? `<span class="said">Checked off in CompanyCam ${i.cc_completed_at?ago(i.cc_completed_at):""}</span>`
    : i.last_contact_summary
      ? `<span class="said ${stale?'stale':''}">${esc(i.last_contact_summary)}<span class="when">${ago(i.last_contact_at)}</span></span>`
      : (i.contractor_id||i.cc_contractor_text) ? `<span class="said none">No word from contractor yet</span>` : `<span class="said none">—</span>`;
  const ccFields = [i.cc_price_text?`price ${esc(i.cc_price_text)}`:null, i.cc_finish_date_text?`finish ${esc(i.cc_finish_date_text)}`:null, i.cc_has_been_done?`done? ${esc(i.cc_has_been_done)}`:null].filter(Boolean).join(" · ");
  const inTrade = CONTRACTORS.filter(c=>c.trade===i.trade || c.id===i.contractor_id);
  const pool = (SHOW_ALL[i.id] || !i.trade || inTrade.length===0) ? CONTRACTORS : inTrade;
  const opts = pool.map(c=>`<option value="${c.id}" ${c.id===i.contractor_id?'selected':''}>${esc(c.name)}${pool===CONTRACTORS?' — '+esc(c.trade):''}${c.phone?'':' (no phone)'}</option>`).join("")
    + (pool!==CONTRACTORS ? `<option value="__all__">Show everyone…</option>` : "");
  const unmatched = i.cc_contractor_text && !i.contractor_id;
  return `<tr class="${i.cc_done?'done':''}" data-id="${i.id}">
    <td class="no">#${i.item_no??""}</td>
    <td class="desc">${esc(i.description)}<br>
      ${i.trade?`<span class="trade" onclick="askTrade('${i.id}')" title="Change trade" style="cursor:pointer">${esc(i.trade)}</span>`:`<span class="trade ask" onclick="askTrade('${i.id}')">set trade</span>`}
    </td>
    <td><div class="truth">
      <span class="k">CompanyCam</span><span class="v cc"><span class="box ${i.cc_done?'on':''}">${i.cc_done?'✓':''}</span>${i.cc_done?'done':'not done'}${i.cc_photo_count?`<span class="photos">· ${i.cc_photo_count} photo${i.cc_photo_count===1?'':'s'}</span>`:''}${ccFields?`<span class="photos">· ${ccFields}</span>`:''}</span>
      <span class="k">Last word</span><span class="v">${said}</span>
    </div></td>
    <td class="who">
      ${st.pill}
      <select onchange="assign('${i.id}', this.value)" ${i.cc_done?'disabled':''}>
        <option value="">— pick a contractor —</option>${opts}
      </select>
      ${i.cc_contractor_text?`<div class="cctext ${unmatched?'unmatched':''}">CompanyCam says: <b>${esc(i.cc_contractor_text)}</b>${unmatched?' — not in directory':''}</div>`:""}
      ${bidList(i)}
      ${invoiceLine(i)}
      ${i.report_excerpt_url?`<div class="cctext"><a href="${esc(i.report_excerpt_url)}" target="_blank" rel="noopener" style="color:var(--info)">Inspection report${i.report_section?" "+esc(i.report_section):""} (highlighted)</a></div>`:""}
    </td>
    <td class="act">
      ${i.cc_done?'' : (i.contractor_id
        ? `<button class="ubtn small" onclick="chase('${i.id}')">Text for status</button>`
        : internalFor(i.trade)
          ? `<button class="ubtn small primary" onclick="sendInternal('${i.id}')" ${i.dispatched_n>0?'disabled':''}>${i.dispatched_n>0?'Sent to maintenance':'Send to maintenance'}</button>`
          : `<button class="ubtn small primary" onclick="bids('${i.id}')" ${i.dispatched_n>0?'disabled':''}>${i.dispatched_n>0?'Bids requested':'Get 3 bids'}</button>`)}
    </td>
  </tr>`;
}

function bidList(i){
  const b = (i.bids||[]); if(!b.length || i.cc_done) return "";
  return `<div class="bidlist">` + b.map(x=>`<div class="bid"><b>$${Number(x.price).toLocaleString()}</b> ${esc(x.contractor||"")}${x.start_date?` · can start ${fmt(x.start_date)}`:""}
    ${x.awarded?'<span class="pill yes">awarded</span>':(i.awarded_bid_id?'':`<button class="ubtn small primary" onclick="awardBid('${i.id}','${x.id}')">Award</button>`)}</div>`).join("") + `</div>`;
}
async function awardBid(itemId, bidId){
  const i = ITEMS.find(x=>x.id===itemId); const b = (i.bids||[]).find(x=>x.id===bidId);
  const start = prompt(`Award ${i.address} #${i.item_no} to ${b.contractor} for $${Number(b.price).toLocaleString()}.\n\nStart date (YYYY-MM-DD)? Leave blank to ask them for one.`, b.start_date||"");
  if (start === null) return;
  if (start && !/^\d{4}-\d{2}-\d{2}$/.test(start.trim())) return toast("Use a date like 2026-10-14");
  toast("Sending…");
  const r = await fn("rtr-dispatch", { action:"award", bid_id:bidId, start_date: start.trim()||undefined });
  toast(r.error ? r.error : `Awarded to ${r.contractor} — waiting on their YES`);
  await load();
}
async function assign(id, contractor_id){
  if(contractor_id==="__all__"){ SHOW_ALL[id]=true; render(); return; }
  const { error } = await sb.from("rtr_items").update({ contractor_id: contractor_id||null, status: contractor_id?"awarded":"new" }).eq("id", id);
  if(error) return toast("Couldn't save: "+error.message);
  toast(contractor_id ? "Assigned" : "Unassigned"); await load();
}
async function askTrade(id){
  const cur = ITEMS.find(x=>x.id===id)?.trade || "";
  const t = prompt("Trade for this item (type one):\n" + TRADES.join(" · "), cur);
  if(!t) return;
  const { error } = await sb.from("rtr_items").update({ trade: t }).eq("id", id);
  if(error) return toast("Couldn't save: "+error.message);
  await load();
}
async function fn(name, body){
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, { method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+ANON_JWT }, body: JSON.stringify(body) });
  return r.json();
}
// ---- pick who gets the bid request (Tom 10/8: Gabe chooses; the top 3 are pre-checked) ----
const NO_USE = ["4 - Do not use","Stay Away"];
const tierShort = t => !t ? "unrated" : /^1/.test(t) ? "Best" : /^2/.test(t) ? "Good" : /^3/.test(t) ? "Only if needed" : /^5/.test(t) ? "Unsure" : "Unrated";
const tierRank = t => /^1/.test(t||"") ? 1 : /^2/.test(t||"") ? 2 : /^3/.test(t||"") ? 3 : /^5/.test(t||"") ? 5 : 6;
let PICK = null;
function ranked(trade){
  return CONTRACTORS.filter(c=>(!trade || c.trade===trade) && !NO_USE.includes(c.vetting_tier) && !c.is_internal)
    .sort((a,b)=> tierRank(a.vetting_tier)-tierRank(b.vetting_tier) || (b.jobs_done_n||0)-(a.jobs_done_n||0) || a.name.localeCompare(b.name));
}
// Tom 10/8: "Get 3 bids" opens the list and Gabe picks Choice 1, 2, 3 himself. Nothing is pre-picked.
function bids(id){
  const i = ITEMS.find(x=>x.id===id);
  if(!i.trade){ toast("Set the trade first so it knows which contractors to show"); return; }
  PICK = { id, slots: ["","",""], all: false };
  renderPicker();
}
function renderPicker(){
  if(!PICK){ $("#picker").innerHTML=""; return; }
  const i = ITEMS.find(x=>x.id===PICK.id);
  const list = PICK.all ? ranked(null) : ranked(i.trade);
  const label = c => `${c.name}${PICK.all?' — '+c.trade:''} · ${tierShort(c.vetting_tier)} · ${c.jobs_done_n?c.jobs_done_n+' jobs with us':'no jobs logged'}${c.phone?'':' · NO PHONE'}`;
  const slot = k => {
    const taken = PICK.slots.filter((v,j)=>j!==k && v);
    const opts = list.map(c=>`<option value="${c.id}" ${PICK.slots[k]===c.id?'selected':''} ${(!c.phone||taken.includes(c.id))?'disabled':''}>${esc(label(c))}</option>`).join("");
    return `<div class="pick" style="cursor:default"><span class="tier t1" style="min-width:74px;text-align:center">Choice ${k+1}</span>
      <select style="flex:1;background:var(--bg);border:1px solid var(--line2);color:#fff;border-radius:6px;padding:7px 8px;font-size:13px;min-width:0" onchange="PICK.slots[${k}]=this.value;renderPicker()">
        <option value="">— pick a contractor —</option>${opts}</select></div>`;
  };
  const n = PICK.slots.filter(Boolean).length;
  const need = Math.min(3, list.filter(c=>c.phone).length);
  $("#picker").innerHTML = `<div class="modal-bg" onclick="if(event.target===this){PICK=null;renderPicker()}"><div class="modal">
    <div class="modal-h"><b>Get 3 bids — who should we text?</b><p>${esc(i.address)} #${i.item_no??""} — ${esc(i.description.slice(0,140))}</p>
      <p>Pick your first, second and third choice. The list shows each contractor's rating and how many jobs they've done with us.</p></div>
    <div class="modal-b">${list.length ? [0,1,2].map(slot).join("") : `<div class="sched-empty">No ${esc(i.trade)} contractors in the directory. Tap "Show other trades".</div>`}</div>
    <div class="modal-f"><button class="ubtn small" onclick="PICK.all=!PICK.all;renderPicker()">${PICK.all?'Only '+esc(i.trade):'Show other trades'}</button>
      <span class="sp"></span><span class="cnt">${n} of 3 picked</span>
      <button class="ubtn small" onclick="PICK=null;renderPicker()">Cancel</button>
      <button class="ubtn small primary" ${n && n>=need?'':'disabled'} onclick="sendPicked()">Text ${n||3} for bids</button></div>
  </div></div>`;
}
async function sendPicked(){
  const ids = PICK.slots.filter(Boolean), id = PICK.id;
  const names = ids.map((x,k)=>`${k+1}. ${CONTRACTORS.find(c=>c.id===x)?.name||""}`);
  if(!confirm(`Text these ${ids.length} to ask if they want to bid?\n\n${names.join("\n")}`)) return;
  PICK=null; renderPicker(); toast("Sending…");
  const r = await fn("rtr-dispatch", { action:"dispatch", item_id:id, contractor_ids: ids });
  if(r.error) return toast(r.error);
  toast(r.sent?.length ? `Sent to ${r.sent.join(", ")}${r.skipped?.length?` (skipped: ${r.skipped.join("; ")})`:""}` : `Couldn't send — ${(r.failed||r.skipped||[])[0]||"nobody picked"}`);
  await load();
}
// ---- maintenance (Tom 10/8): Handyman / General goes to the internal team, same texts, no bid ----
const internalFor = trade => CONTRACTORS.find(c=>c.is_internal && c.trade===trade);
async function sendInternal(id){
  const i = ITEMS.find(x=>x.id===id); const m = internalFor(i.trade);
  if(!m.phone){
    const ph = prompt(`What's ${m.name}'s cell number? (saved for next time)`, "");
    if(!ph) return;
    const d = ph.replace(/\D/g,"").replace(/^1(?=\d{10}$)/,"");
    if(d.length!==10) return toast("That doesn't look like a 10-digit number");
    const { error } = await sb.from("contractor_directory").update({ phone: `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` }).eq("id", m.id);
    if(error) return toast("Couldn't save the number: "+error.message);
    m.phone = d;
  }
  if(!confirm(`Text ${m.name} this job?\n\n${i.description}\n\nat ${i.address}`)) return;
  toast("Sending…");
  const r = await fn("rtr-dispatch", { action:"dispatch", item_id:id });
  toast(r.error ? r.error : `Sent to ${(r.sent||[]).join(", ")}`);
  await load();
}

// ---- invoices made for the contractor (Tom 10/8) ----
function invoiceLine(i){
  if(i.cc_done && !i.invoice_status) return "";
  if(i.invoice_status==="signed") return `<div class="cctext"><a href="${esc(i.invoice_signed_url)}" target="_blank" rel="noopener" style="color:var(--ok)">Invoice ${esc(i.invoice_no||"")} signed ✓</a></div>`;
  if(i.invoice_status==="sent"||i.invoice_status==="draft") return `<div class="cctext">Invoice ${esc(i.invoice_no||"")} sent, waiting on their signature <button class="ubtn small" onclick="sendInvoice('${i.id}')">Resend</button></div>`;
  if(i.awarded_bid_id && i.award_confirmed_at && !i.contractor_internal) return `<div class="cctext"><button class="ubtn small" onclick="sendInvoice('${i.id}')">Send invoice to sign</button></div>`;
  return "";
}
async function sendInvoice(id){
  toast("Sending…");
  const r = await fn("rtr-dispatch", { action:"invoice", item_id:id });
  toast(r.error ? r.error : r.already==="signed" ? "Already signed" : `Invoice ${r.invoice_no} sent to sign`);
  await load();
}

// ---- inspection report: upload once per property; each item gets its section highlighted (Tom 10/8) ----
function reportBtn(items){
  const it = items[0]; if(!it.property_id) return "";
  const n = items.filter(i=>i.report_excerpt_url).length;
  return it.report_url
    ? `<a href="${esc(it.report_url)}" target="_blank" rel="noopener">Inspection report</a><span class="meta">${n} of ${items.length} highlighted</span><a href="#" onclick="pickReport('${it.property_id}',true);return false">Redo highlights</a><a href="#" onclick="pickReport('${it.property_id}');return false">Replace report</a>`
    : `<button class="ubtn small" onclick="pickReport('${it.property_id}')">Upload inspection report</button>`;
}
let LIBS = null;
async function libs(){
  if(LIBS) return LIBS;
  const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
  if(!window.PDFLib) await new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"; s.onload=ok; s.onerror=bad; document.head.appendChild(s); });
  return LIBS = { pdfjs, PDFLib: window.PDFLib };
}
function pickReport(pid, redo){
  if(redo){ const it = ITEMS.find(i=>i.property_id===pid && i.report_url); return processReport(pid, null, it.report_url); }
  const inp = document.createElement("input"); inp.type="file"; inp.accept="application/pdf";
  inp.onchange = () => inp.files[0] && processReport(pid, inp.files[0], null);
  inp.click();
}
async function processReport(pid, file, existingUrl){
  try{
    toast("Reading the report…");
    const { pdfjs, PDFLib } = await libs();
    const bytes = file ? new Uint8Array(await file.arrayBuffer()) : new Uint8Array(await (await fetch(existingUrl)).arrayBuffer());
    const doc = await pdfjs.getDocument({ data: bytes.slice() }).promise;
    const pages = [];
    for(let n=1;n<=doc.numPages;n++){ const pg = await doc.getPage(n); const tc = await pg.getTextContent(); pages.push({ n, lines: RC.toLines(tc.items) }); }
    const items = ITEMS.filter(i=>i.property_id===pid && !i.cc_done);
    const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
    const slots = await fn("rtr-dispatch", { action:"report_upload_urls", property_id: pid, item_ids: items.map(i=>i.id), with_report: !!file });
    if(slots.error) throw new Error(slots.error);
    if(file){ toast("Uploading the report…"); const up = await sb.storage.from("rtr-photos").uploadToSignedUrl(slots.report.path, slots.report.token, new Blob([bytes],{type:"application/pdf"})); if(up.error) throw new Error(up.error.message); }
    const saved = []; let hit = 0;
    for(const i of items){
      const refs = RC.parseRefs(i.description);
      const spots = refs.sections.map(sec=>RC.locate(pages, sec, refs.pages)).filter(Boolean);
      if(!spots.length && refs.pages.length) spots.push({ page: refs.pages[0], top:null, bottom:null, extra: refs.pages.slice(1).map(n=>({n,bottom:36})) });
      const valid = spots.filter(sp=>sp.page>=1 && sp.page<=doc.numPages).map(sp=>({ ...sp, extra: sp.extra.filter(e=>e.n<=doc.numPages) }));
      if(!valid.length){ saved.push({ item_id:i.id, section: refs.sections.join(", ")||null, pages:null, path:null }); continue; }
      toast(`Highlighting #${i.item_no}…`);
      const out = await RC.buildExcerpt(PDFLib, src, valid, `${i.address} #${i.item_no ?? ""} ${i.description}`);
      const slot = slots.items[i.id];
      const up = await sb.storage.from("rtr-photos").uploadToSignedUrl(slot.path, slot.token, new Blob([out],{type:"application/pdf"}));
      if(up.error) throw new Error(up.error.message);
      const pgs = [...new Set(valid.flatMap(v=>[v.page, ...v.extra.map(e=>e.n)]))];
      saved.push({ item_id:i.id, section: refs.sections.join(", ")||null, pages: pgs, path: slot.path }); hit++;
    }
    const r = await fn("rtr-dispatch", { action:"report_save", property_id: pid, report_path: file ? slots.report.path : null, filename: file?.name, page_count: doc.numPages, items: saved, note: `${hit}/${items.length} items highlighted` });
    if(r.error) throw new Error(r.error);
    toast(`Done: ${hit} of ${items.length} items highlighted${hit<items.length?" (the rest have no section number)":""}`);
    await load();
  } catch(e){ console.error(e); toast("Report problem: " + (e.message||e)); }
}
// section finder (same logic as report_core.ts)
const RC = (() => {
  const HEAD = /^(\d{1,2}(?:\.\d{1,2}){1,2})(?=[\s.:)\-]|[A-Za-z])/;
  const isHead = t => (HEAD.exec(t.trim())||[])[1] || null;
  const inSec = (h, sec) => h === sec || h.startsWith(sec + ".");
  function parseRefs(desc){
    const s = desc||""; const secs = new Set();
    for(const m of s.matchAll(/(?:^|[\s(,;]|item\s*)(\d{1,2}\.\d{1,2}(?:\.\d{1,2})?)(?=[\s),;:]|$)/gi)) secs.add(m[1]);
    const pages = [];
    for(const m of s.matchAll(/\b(?:pg|page|pages|pp?\.)\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?/gi)){ const a=+m[1], b=m[2]?+m[2]:a; for(let p=a;p<=Math.min(b,a+4);p++) pages.push(p); }
    return { sections:[...secs], pages };
  }
  function toLines(items){
    const rows = [];
    const its = items.filter(i=>(i.str||"").trim()).map(i=>({ str:i.str, x:i.transform[4], y:i.transform[5], h:Math.abs(i.height||i.transform[3]||10) }));
    its.sort((a,b)=>b.y-a.y || a.x-b.x);
    for(const it of its){
      const row = rows.find(r=>Math.abs(r.y-it.y) <= Math.max(2, it.h*0.35));
      if(row){ row.text = (row.x<=it.x ? row.text+" "+it.str : it.str+" "+row.text).replace(/\s+/g," "); row.x=Math.min(row.x,it.x); row.h=Math.max(row.h,it.h); }
      else rows.push({ text: it.str.trim(), x: it.x, y: it.y, h: it.h });
    }
    return rows.sort((a,b)=>b.y-a.y);
  }
  function locate(pages, sec, hint=[]){
    const hits = [];
    for(const p of pages){ const heads = p.lines.filter(l=>isHead(l.text)).length; p.lines.forEach((l,idx)=>{ const h=isHead(l.text); if(h && inSec(h,sec)) hits.push({ page:p.n, idx, dense: heads>10 }); }); }
    const pick = hits.find(h=>hint.includes(h.page)) || hits.find(h=>!h.dense) || hits[hits.length-1];
    if(!pick) return null;
    const p = pages.find(x=>x.n===pick.page), head = p.lines[pick.idx];
    let bottom = 36, ends = false;
    for(let i=pick.idx+1;i<p.lines.length;i++){ const h=isHead(p.lines[i].text); if(h && !inSec(h,sec)){ bottom = p.lines[i].y + p.lines[i].h + 2; ends = true; break; } }
    const extra = [];
    if(!ends) for(let n=pick.page+1;n<=pick.page+2;n++){
      const np = pages.find(x=>x.n===n); if(!np || !np.lines.length) break;
      const hi = np.lines.findIndex(l=>{ const h=isHead(l.text); return !!h && !inSec(h,sec); });
      if(hi===0) break;
      if(hi>0){ extra.push({ n, bottom: np.lines[hi].y + np.lines[hi].h + 2 }); break; }
      extra.push({ n, bottom: 36 });
    }
    return { page: pick.page, top: head.y + head.h + 3, bottom, extra };
  }
  async function buildExcerpt(PDFLib, src, spots, title){
    const { PDFDocument, rgb, StandardFonts } = PDFLib;
    const out = await PDFDocument.create(); const font = await out.embedFont(StandardFonts.HelveticaBold);
    const order = []; for(const s of spots) for(const n of [s.page, ...s.extra.map(e=>e.n)]) if(!order.includes(n)) order.push(n);
    const copied = await out.copyPages(src, order.map(n=>n-1));
    copied.forEach((pg, k) => {
      out.addPage(pg); const n = order[k]; const { width, height } = pg.getSize();
      for(const s of spots){
        if(s.page===n && s.top!=null){ const y0=Math.max(s.bottom??36,20), y1=Math.min(s.top,height-4); pg.drawRectangle({ x:18, y:y0, width:width-36, height:Math.max(12,y1-y0), color:rgb(1,0.92,0.2), opacity:0.28, borderColor:rgb(0.95,0.6,0), borderWidth:2, borderOpacity:0.9 }); }
        else if(s.top!=null && s.extra.some(e=>e.n===n)){ const e=s.extra.find(e=>e.n===n); const y0=Math.max(e.bottom,20), y1=height-26; pg.drawRectangle({ x:18, y:y0, width:width-36, height:Math.max(12,y1-y0), color:rgb(1,0.92,0.2), opacity:0.22, borderColor:rgb(0.95,0.6,0), borderWidth:1.5, borderOpacity:0.8 }); }
      }
      const label = ("YOUR JOB: " + title).replace(/[^\x20-\x7E]/g,"").slice(0,110);
      pg.drawRectangle({ x:0, y:height-22, width, height:22, color:rgb(0.1,0.1,0.1), opacity:0.85 });
      pg.drawText(label, { x:10, y:height-15, size:9, font, color:rgb(1,1,1) });
    });
    return await out.save();
  }
  return { parseRefs, toLines, locate, buildExcerpt };
})();

async function chase(id){
  toast("Sending…");
  const r = await fn("rtr-dispatch", { action:"chase", item_id:id });
  toast(r.error ? r.error : "Status request sent");
  await load();
}
